name: Update Dashboard Data

# ============================================================
# 数据更新机制（workflow_run 链 + schedule 兜底）
# ------------------------------------------------------------
# 平台限制回顾：分钟级 schedule 被静默丢弃；GITHUB_TOKEN 的 push 不触发
# workflow；rerun 同一 run 约 50 次后失效（"No jobs were run"）且产生噪音邮件。
#
# 现行机制：数据提交 → GitHub Pages 自动构建（pages build and deployment）
# → 本 workflow 通过 workflow_run 监听该构建完成 → 触发新一轮采集 →
# 数据有变再次提交 → Pages 再次构建 → ……链条自续，每轮都是全新 run
# （无 attempt 累积、无 rerun 邮件）。BEAT 步骤把节拍对齐到 ~10 分钟。
# ============================================================

on:
  schedule:
    - cron: "*/10 * * * *"   # 兜底：平台调度偶发捡到时补链
  workflow_dispatch:
    inputs:
      interval:
        description: "更新频率标识（写入 JSON，10min / hourly / daily）"
        required: false
        default: "10min"
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

env:
  BEAT_SECS: "480"            # 节拍下限 8 分钟：距上次数据提交不足 8 分钟则等待对齐（≈10 分钟/拍）

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_branch == 'main'
    env:
      DASHBOARD_INTERVAL: ${{ github.event.inputs.interval || '10min' }}
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare lunar-python

      - name: 等待至节拍（距上次数据提交不足8分钟则对齐）
        run: |
          LAST=$(git log -1 --format=%ct -- data/dashboard.json 2>/dev/null || echo 0)
          NOW=$(date +%s)
          ELAPSED=$(( NOW - LAST ))
          WAIT=$(( BEAT_SECS - ELAPSED ))
          if [ $WAIT -gt 0 ] && [ $WAIT -lt 600 ]; then
            echo "距上次数据 ${ELAPSED}s，等待 ${WAIT}s 对齐节拍"
            sleep $WAIT
          else
            echo "距上次数据 ${ELAPSED}s，立即采集"
          fi

      - name: Collect data (markets / news / wuxing)
        id: collect
        continue-on-error: true
        run: python scripts/update_data.py

      - name: Commit & Push（数据提交）
        if: always()
        run: |
          if [ -f data/dashboard.json ] && ! git diff --quiet HEAD -- data/dashboard.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dashboard.json
            git commit -m "chore(data): 仪表盘数据更新 ${{ github.event.inputs.interval || '10min' }}"
            git push
            echo "dashboard.json 已提交推送"
          else
            echo "数据无变化，跳过提交"
          fi

      - name: 接力下一拍（PAT 节拍提交触发新一轮 run；未配置 PAT 时依赖 schedule 兜底）
        if: always()
        env:
          PAT: ${{ secrets.DASH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PAT" ]; then
            echo "未配置 Secrets.DASH_PAT，跳过接力（schedule 兜底，约数小时一拍）"
            exit 0
          fi
          echo "推送节拍提交触发下一轮（新 run，无 attempt 累积）……"
          git config user.name "dashboard-beat-bot"
          git config user.email "beat@users.noreply.github.com"
          echo "beat $(date -u +%FT%TZ)" > .github/.beat
          git add .github/.beat
          git commit -m "chore: beat tick" -q
          git push "https://x-access-token:${PAT}@github.com/${REPO}.git" main \
            && echo "已触发下一拍" || echo "接力推送失败（schedule 兜底）"
