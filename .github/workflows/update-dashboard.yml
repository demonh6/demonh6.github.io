name: Update Dashboard Data

# ============================================================
# 数据更新机制（rerun 自续链 + schedule 兜底）
# ------------------------------------------------------------
# 平台限制：GITHUB_TOKEN 的 push 永远不会触发新 workflow（防递归），
# 分钟级 schedule 又被 GitHub 静默丢弃（实测 */10 连续数小时零触发）。
# 因此采用 rerun 自续：每轮 run 末尾等待节拍后用 API rerun 自身——
# rerun 属于直接 API 调用，不受"事件不触发"限制，且历史里聚合为一个 run。
# 数据点间隔 = sleep(480s) + 排队 + 采集 ≈ 10 分钟。
# ============================================================

on:
  schedule:
    - cron: "*/10 * * * *"   # 兜底：平台若恢复调度可补链
  workflow_dispatch:          # 支持手动触发
    inputs:
      interval:
        description: "更新频率标识（写入 JSON，10min / hourly / daily）"
        required: false
        default: "10min"
  push:                       # 代码/数据变更立即刷新一轮
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - ".github/workflows/**"
      - "index.html"

permissions:
  contents: write
  actions: write              # 允许 rerun API 自续链条

concurrency:
  group: update-dashboard
  cancel-in-progress: false

env:
  BEAT_SECS: "480"            # 节拍：8 分钟 sleep + 采集 ≈ 每 10 分钟一个数据点

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DASHBOARD_INTERVAL: ${{ github.event.inputs.interval || '10min' }}
    steps:
      - name: Checkout (main，rerun 时取最新代码)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare lunar-python

      - name: Collect data (markets / news / wuxing)
        id: collect
        continue-on-error: true   # 部分数据源失败仍提交已有结果，页面会显示对应模块"暂缺"
        run: python scripts/update_data.py

      - name: Commit & Push
        if: always()
        run: |
          if [ -f data/dashboard.json ] && ! git diff --quiet HEAD -- data/dashboard.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dashboard.json
            git commit -m "chore(data): 仪表盘数据更新 ${{ github.event.inputs.interval || '10min' }}"
            git push
            echo "dashboard.json 已提交推送"
          else
            echo "数据无变化，跳过提交"
          fi

      - name: 接力到 B 环（等待节拍后 rerun B 的最近 run）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "等待 ${BEAT_SECS}s 后接力到 B 环……"
          sleep $BEAT_SECS
          B_RUN_ID=$(gh run list --workflow update-beat.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "B 环最近 run: $B_RUN_ID"
          gh api -X POST "repos/${{ github.repository }}/actions/runs/${B_RUN_ID}/rerun" \
            && echo "已接力到 B 环" || echo "接力失败（等待下次 push/schedule 兜底）"
