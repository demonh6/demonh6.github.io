name: Update Dashboard Data

# ============================================================
# 数据更新频率
# ------------------------------------------------------------
# 当前：每小时一次（整点触发，UTC 0 * * * * = 北京时间每小时整点）
# 【切换回每日更新】将下方 schedule.cron 改为 "30 23 * * *"
#   （UTC 23:30 = 北京时间次日 07:30，可覆盖美股收盘），
#   同时把 env.DASHBOARD_INTERVAL 的默认值改回 'daily'。
# 页面文案自动随 data/dashboard.json 的 interval 字段切换。
# ============================================================

on:
  schedule:
    - cron: "*/10 * * * *"   # 每10分钟一次；脚本内按信源分级降频（30分钟/1小时/2小时），数据提交带 [skip ci] 不会递归
  workflow_dispatch:          # 支持手动触发
    inputs:
      interval:
        description: "更新频率标识（写入 JSON，10min / hourly / daily）"
        required: false
        default: "10min"
  push:                       # 脚本/数据变更时立即刷新一次（数据提交自带 [skip ci] 不会递归）
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DASHBOARD_INTERVAL: ${{ github.event.inputs.interval || '10min' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare lunar-python

      - name: Collect data (markets / news / wuxing)
        id: collect
        continue-on-error: true   # 部分数据源失败仍提交已有结果，页面会显示对应模块"暂缺"
        run: python scripts/update_data.py

      - name: Commit & Push
        if: always()
        run: |
          if [ -f data/dashboard.json ] && ! git diff --quiet HEAD -- data/dashboard.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dashboard.json
            git commit -m "chore(data): 仪表盘数据更新 ${{ github.event.inputs.interval || '10min' }} [skip ci]"
            git push
            echo "dashboard.json 已提交推送"
          else
            echo "数据无变化，跳过提交"
          fi
