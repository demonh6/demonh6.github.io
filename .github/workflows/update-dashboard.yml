name: Update Dashboard Data

# ============================================================
# 数据更新机制（自续链 + schedule 兜底）
# ------------------------------------------------------------
# GitHub 平台对分钟级 schedule 会静默丢弃（实测 */10 连续数小时零触发），
# 因此采用"自续链"：每次数据提交（不带 [skip ci]）触发下一轮 run，
# run 开头等待至 10 分钟节拍再采集 → 提交 → 再触发……链条自续。
# schedule 保留作为链条断点时的兜底；concurrency 串行防堆积。
# 节拍下限 8 分钟（BEAT_SECS），实测数据点间隔约 10 分钟。
# 【切换回每日更新】cron 改 "30 23 * * *" 且数据提交加回 [skip ci]。
# ============================================================

on:
  schedule:
    - cron: "*/10 * * * *"   # 兜底：平台若恢复调度可补链
  workflow_dispatch:          # 支持手动触发
    inputs:
      interval:
        description: "更新频率标识（写入 JSON，10min / hourly / daily）"
        required: false
        default: "10min"
  push:                       # 数据/代码提交触发下一轮（自续链的驱动源）
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - ".github/workflows/**"
      - "index.html"

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

env:
  BEAT_SECS: "480"            # 节拍下限 8 分钟：距上次数据提交不足 8 分钟则等待对齐

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DASHBOARD_INTERVAL: ${{ github.event.inputs.interval || '10min' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare lunar-python

      - name: 等待至节拍（距上次数据提交不足8分钟则对齐10分钟槽位）
        run: |
          LAST=$(git log -1 --format=%ct -- data/dashboard.json 2>/dev/null || echo 0)
          NOW=$(date +%s)
          ELAPSED=$(( NOW - LAST ))
          WAIT=$(( BEAT_SECS - ELAPSED ))
          if [ $WAIT -gt 0 ] && [ $WAIT -lt 600 ]; then
            echo "距上次数据 ${ELAPSED}s，等待 ${WAIT}s 对齐节拍"
            sleep $WAIT
          else
            echo "距上次数据 ${ELAPSED}s，立即采集"
          fi

      - name: Collect data (markets / news / wuxing)
        id: collect
        continue-on-error: true   # 部分数据源失败仍提交已有结果，页面会显示对应模块"暂缺"
        run: python scripts/update_data.py

      - name: Commit & Push
        if: always()
        run: |
          if [ -f data/dashboard.json ] && ! git diff --quiet HEAD -- data/dashboard.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dashboard.json
            git commit -m "chore(data): 仪表盘数据更新 ${{ github.event.inputs.interval || '10min' }}"
            git push
            echo "dashboard.json 已提交推送（将触发下一轮自续）"
          else
            echo "数据无变化，跳过提交"
          fi
