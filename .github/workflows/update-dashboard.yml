name: Update Dashboard Data

# ============================================================
# 数据更新频率
# ------------------------------------------------------------
# 当前：每日一次（UTC 23:30 = 北京时间次日 07:30，可覆盖美股收盘）
# 【切换为每小时更新】将下方 schedule.cron 改为 "0 * * * *" 即可，
#   页面会自动显示"每小时更新"（读取 data/dashboard.json 的 interval 字段）。
#   注意：每小时更新会显著增加 Actions 运行次数（公共仓库免费额度 2000 分钟/月）。
# ============================================================

on:
  schedule:
    - cron: "30 23 * * *"   # 每日一次（北京时间 07:30）；每小时更新改为 "0 * * * *"
  workflow_dispatch:          # 支持手动触发
    inputs:
      interval:
        description: "更新频率标识（写入 JSON，daily / hourly）"
        required: false
        default: "daily"

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DASHBOARD_INTERVAL: ${{ github.event.inputs.interval || 'daily' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare lunar-python

      - name: Collect data (markets / news / wuxing)
        id: collect
        continue-on-error: true   # 部分数据源失败仍提交已有结果，页面会显示对应模块"暂缺"
        run: python scripts/update_data.py

      - name: Commit & Push
        if: always()
        run: |
          if [ -f data/dashboard.json ] && ! git diff --quiet HEAD -- data/dashboard.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dashboard.json
            git commit -m "chore(data): 每日仪表盘数据更新 ${{ github.event.inputs.interval || 'daily' }} [skip ci]"
            git push
            echo "dashboard.json 已提交推送"
          else
            echo "数据无变化，跳过提交"
          fi
